name: Test

on:
  pull_request:
    branches:
      - 'master'
    # No `paths:` filter: `test` is a required status check on master, so it
    # has to report on every PR or a PR that skips it can never merge.

jobs:
  test:
    runs-on: ubuntu-latest
    environment: default
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'

      - name: Run Tests
        run: make test

      - name: Build App
        run: make build
